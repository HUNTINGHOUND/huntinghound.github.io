<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Haoran Xu. Find me on LinkedIn and GitHub." />
    <meta property="og:title" content="Haoran Xu" />
    <meta property="og:description" content="Find me on LinkedIn and GitHub." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://huntinghound.github.io/" />
    <link rel="canonical" href="https://huntinghound.github.io/" />
    <link rel="icon" href="data:," />
    <title>Haoran Xu</title>
    <style>
      :root {
        font-family: Arial, Helvetica, sans-serif;
        color: #171717;
        background: #ffffff;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main {
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: flex-start;
        padding: 48px 24px 64px 27.25vw;
      }
      h1 {
        margin: 0;
        font-size: clamp(44px, 5.3vw, 84px);
        line-height: 1.12;
        font-weight: 400;
        letter-spacing: -0.028em;
      }
      nav { display: flex; flex-wrap: wrap; gap: 40px; margin-top: 32px; }
      a {
        color: #646464;
        font-size: clamp(18px, 1.5vw, 24px);
        line-height: 1.5;
        text-decoration-line: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 5px;
        transition: color 150ms ease;
      }
      a:hover { color: #171717; }
      a:focus-visible { outline: 2px solid #171717; outline-offset: 7px; border-radius: 1px; }
      @media (max-width: 600px) {
        main { padding-inline: 24px; }
        nav { margin-top: 24px; gap: 26px; }
      }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Haoran Xu</h1>
      <nav aria-label="Social links">
        <a href="https://www.linkedin.com/in/haoran-xu-194007182/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://github.com/HUNTINGHOUND" target="_blank" rel="noopener noreferrer">GitHub</a>
      </nav>
    </main>
  </body>
</html>
